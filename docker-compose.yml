services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: reelpilot
      POSTGRES_USER: reelpilot
      POSTGRES_PASSWORD: reelpilot
    ports:
      - "5432:5432"
    volumes:
      - reelpilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelpilot -d reelpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reelpilot_postgres:

